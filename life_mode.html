<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LIFE MODE — Prototype 0.1</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1018;color:#fff;font-family:system-ui,-apple-system,Arial}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.brand{background:#101923dc;border:1px solid #ffffff24;border-radius:14px;padding:10px 13px;backdrop-filter:blur(8px)}.brand b{letter-spacing:2px;font-size:15px}.brand small{display:block;color:#aebdca;font-size:10px;letter-spacing:1.3px;margin-top:2px}.stats{background:#101923dc;border:1px solid #ffffff24;border-radius:14px;padding:9px 12px;font-size:12px;text-align:right;line-height:1.65}.stats strong{color:#7df2bc}.hint{position:absolute;top:88px;left:12px;padding:8px 10px;border-radius:10px;background:#101923bd;color:#d6e1ea;font-size:11px;max-width:230px}.bottom{position:absolute;bottom:15px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:flex-end}.controls{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,48px);gap:6px;pointer-events:auto}.ctrl{border:1px solid #ffffff35;border-radius:14px;background:#142331d9;color:white;font-size:19px;font-weight:700;touch-action:none;user-select:none}.ctrl:active,.ctrl.on{background:#1c886c}.empty{visibility:hidden}.actions{display:flex;flex-direction:column;gap:8px;pointer-events:auto;align-items:flex-end}.action{border:1px solid #ffffff38;border-radius:13px;background:#101923e8;color:white;padding:11px 13px;font-size:12px;font-weight:700;touch-action:manipulation}.action.primary{background:#1a755e}.message{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);background:#101923ed;border:1px solid #ffffff35;border-radius:16px;padding:18px 20px;text-align:center;width:min(84vw,340px);display:none;pointer-events:auto}.message h2{margin:0 0 8px;letter-spacing:2px}.message p{font-size:13px;color:#c5d1dc;line-height:1.5}.message button{background:#1a755e;color:white;border:0;border-radius:10px;padding:11px 18px;font-weight:700}.footer{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:9px;color:#ffffff8a;white-space:nowrap}@media(min-width:700px){.controls{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px)}.ctrl{font-size:23px}.hint{font-size:13px}}
</style></head><body><div id="hud"><div class="top"><div class="brand"><b>LIFE MODE</b><small>OPEN WORLD • PROTOTYPE 0.1</small></div><div class="stats">CASH <strong id="cash">₦5,000</strong><br>CAR <strong>VOLT S / EV</strong></div></div><div class="hint" id="hint">Explore the city. Follow the road and earn cash from the Job button.</div><div class="bottom"><div class="controls"><button class="ctrl empty"> </button><button class="ctrl" data-key="up">▲</button><button class="ctrl empty"> </button><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="down">▼</button><button class="ctrl" data-key="right">▶</button></div><div class="actions"><button class="action" id="job">💼 QUICK JOB +₦1,000</button><button class="action" id="home">⌂ GO TO HOME</button><button class="action primary" id="reset">↻ RESET CAR</button></div></div><div class="footer">LIFE MODE © • Built as a first playable prototype</div><div class="message" id="modal"><h2>LIFE MODE</h2><p id="modalText">Welcome to the city.</p><button id="close">CONTINUE</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91b5ca);scene.fog=new THREE.Fog(0x91b5ca,70,230);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=false;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8ecff,0x46515b,2));const sun=new THREE.DirectionalLight(0xffe2b3,2.4);sun.position.set(-30,70,25);scene.add(sun);
const mat=(c,r=0.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const groundMat=mat(0x687d68),roadMat=mat(0x303942),lineMat=mat(0xe4d9a8),sideMat=mat(0xb7b8b0),glass=mat(0x244653,.25,.5),tire=mat(0x15191c),white=mat(0xe7edf1,.3,.25),black=mat(0x121820,.3,.3),lamp=mat(0xfde9a8,.25,.1);
function box(w,h,d,material,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);parent.add(o);return o}
box(500,.5,500,groundMat,0,-.5,0);box(20,.08,260,roadMat,0,.02,0);box(260,.08,20,roadMat,0,.025,0);for(let z=-120;z<=120;z+=10)box(.18,.025,4,lineMat,0,.08,z);for(let x=-120;x<=120;x+=10)box(4,.025,.18,lineMat,x,.08,0);box(23,.1,263,sideMat,0,-.02,0);box(263,.1,23,sideMat,0,-.02,0);
// City blocks and small parks
let seed=42;function rand(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}const buildingMats=[0x9ba8b0,0x697f8d,0xc0b5a3,0x8b9a9d,0x505e6a,0xd1c6b5].map(c=>mat(c,.85));
for(let ix=-5;ix<=5;ix++)for(let iz=-5;iz<=5;iz++){if(Math.abs(ix)<=1||Math.abs(iz)<=1)continue;let x=ix*22+(rand()-.5)*4,z=iz*22+(rand()-.5)*4,w=8+rand()*7,d=8+rand()*7,h=7+rand()*28;if(rand()<.16){box(12,.2,12,mat(0x426c52),x,.03,z);continue}const b=box(w,h,d,buildingMats[Math.floor(rand()*buildingMats.length)],x,h/2,z);if(h>20){box(w*.7,.5,d*.7,mat(0x344450),x,h+.25,z)}for(let yy=2;yy<h-1;yy+=2.8){for(let xx=-w/2+1;xx<w/2-0.5;xx+=2){box(.8,.9,.08,mat(0x90b9c7,.3,.15),x+xx,yy,z+d/2+.05);box(.8,.9,.08,mat(0x90b9c7,.3,.15),x+xx,yy,z-d/2-.05)}}}
// Car group
const car=new THREE.Group();scene.add(car);box(2.2,.65,4.2,white,0,.75,0,car);box(1.75,.65,2.1,glass,0,1.28,-.25,car);box(1.78,.12,1.9,black,0,1.62,-.25,car);box(.18,.16,.1,lamp,-.78,.83,2.12,car);box(.18,.16,.1,lamp,.78,.83,2.12,car);box(.22,.16,.1,mat(0xff3333),-.78,.82,-2.12,car);box(.22,.16,.1,mat(0xff3333),.78,.82,-2.12,car);
const wheels=[];for(const x of [-1.08,1.08])for(const z of [-1.35,1.35]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,12),tire);wh.rotation.z=Math.PI/2;wh.position.set(x,.42,z);car.add(wh);wheels.push(wh)}car.position.set(0,0,7);let heading=Math.PI;let speed=0;let cash=5000;const keys={up:false,down:false,left:false,right:false};const cashEl=document.getElementById('cash');function money(n){cash+=n;cashEl.textContent='₦'+cash.toLocaleString('en-NG')}
function popup(text){document.getElementById('modalText').textContent=text;document.getElementById('modal').style.display='block'}document.getElementById('close').onclick=()=>document.getElementById('modal').style.display='none';document.getElementById('job').onclick=()=>{money(1000);popup('You completed a quick delivery job. Your balance increased by ₦1,000. More missions will be added in future versions.')};document.getElementById('home').onclick=()=>{car.position.set(8,0,8);heading=-Math.PI/2;speed=0;popup('You arrived at your starter home. In the next version, you will be able to enter buildings and buy property.')};document.getElementById('reset').onclick=()=>{car.position.set(0,0,7);heading=Math.PI;speed=0};
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('on')};const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off))});window.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')keys.up=true;if(e.key==='ArrowDown'||e.key==='s')keys.down=true;if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true});window.addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='w')keys.up=false;if(e.key==='ArrowDown'||e.key==='s')keys.down=false;if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(keys.up)speed=Math.min(speed+dt*8,13);else if(keys.down)speed=Math.max(speed-dt*12,-4);else speed*=Math.pow(.94,dt*60);if(Math.abs(speed)>.15){if(keys.left)heading+=dt*1.8*Math.sign(speed);if(keys.right)heading-=dt*1.8*Math.sign(speed)}car.rotation.y=heading;car.position.x+=Math.sin(heading)*speed*dt;car.position.z+=Math.cos(heading)*speed*dt;car.position.x=THREE.MathUtils.clamp(car.position.x,-220,220);car.position.z=THREE.MathUtils.clamp(car.position.z,-220,220);wheels.forEach(w=>w.rotation.x+=speed*dt*1.7);const target=new THREE.Vector3(car.position.x,1.1,car.position.z);const behind=new THREE.Vector3(car.position.x-Math.sin(heading)*8,5.5,car.position.z-Math.cos(heading)*8);camera.position.lerp(behind,.09);camera.lookAt(target);renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
